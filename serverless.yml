service: leve-saude-api
licenseKey: ${env:SERVERLESS_LICENSE_KEY}

provider:
  name: aws
  runtime: nodejs24.x
  apiGateway:
    apiKeys:
      - name: ${sls:stage}-api-demo
    usagePlan:
      quota:
        limit: 100
        period: DAY
      throttle:
        rateLimit: 2
        burstLimit: 3
  environment:
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}

plugins:
  - serverless-offline

functions:
  listSchedules:
    handler: src/features/list-schedules/infra/aws/lambda.handler
    events:
      - http:
          path: agendas
          method: get
          private: true
  createAppointment:
    handler: src/features/create-appointment/infra/aws/lambda.handler
    events:
      - http:
          path: agendamento
          method: post
          private: true
  triage:
    handler: src/features/triage/infra/aws/lambda.handler
    timeout: 15
    environment:
      OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
      OPENAI_MODEL: ${env:OPENAI_MODEL, 'gpt-4o-mini'}
    events:
      - http:
          path: triagem
          method: post
          private: true
